version: "3.8"

services:
  mysql:
    image: mysql:5.7
    container_name: wlo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wlo
      MYSQL_USER: wlo
      MYSQL_PASSWORD: wlo123
    ports:
      - "3307:3306"
    volumes:
      - wlo-mysql-data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  wlo-mysql-data:
